name: Wasm R2R setup validation

on:
  push:
    branches: [setup]

permissions:
  contents: read

jobs:
  corelib:
    if: github.repository == 'IsfandyarSiddiqui/runtime'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake cpio libicu-dev libkrb5-dev liblttng-ust-dev libssl-dev lld lldb llvm ninja-build pigz python-is-python3 time
      - name: Build and measure CoreLib
        run: bash eng/wasm-r2r-compression/run-corelib.sh
      - name: Run the composite ReadyToRun module initializer test with Node.js
        run: bash eng/wasm-r2r-compression/run-focused-tests.sh
      - name: Build and measure the default-order composite
        run: bash eng/wasm-r2r-compression/run-composite.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wasm-r2r-setup-${{ github.sha }}
          path: artifacts/wasm-r2r-compression/
          if-no-files-found: warn
          retention-days: 14
